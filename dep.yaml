apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    project: roboshop
    component: frontend
    purpose: rs-demo
    tier: frontend
spec:
  # modify replicas according to your case
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      component: frontend
  template:
    metadata:
      labels:
        project: roboshop
        component: frontend

    spec:
      containers:
      - name: nginx
        image: nginx:latest
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
      project: roboshop
      component: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80 
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  clusterip: None
  selector:
      project: roboshop
      component: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80 