apiVersion: v1
kind: Pod
metadata:
  name: test-pd
spec:
  volumes:
  - name: nginx-logs
    emptyDir:
      sizeLimit: 500Mi
  containers:
  - image: nginx:latest 
    name: nginx
    volumeMounts:
    - mountPath: /var/log/nginx
      name: nginx-logs
  - image: almalinux:9
    name: almalinux
    command: ["sleep","1000"]
    volumeMounts:
    - mountPath: /mnt/nginx-logs
      name: nginx-logs
      readOnly: true
    
